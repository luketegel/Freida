[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freida"
version = "1.0.0"
description = "Static malware triage for native executables: headless Ghidra syscall analysis with Markdown/PDF reports and an AI behavioral overview"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "The Freida Team" }
]
keywords = ["malware-analysis", "reverse-engineering", "ghidra", "syscalls", "static-analysis", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "reportlab>=4.0",
]

[project.optional-dependencies]
ghidra = [
    "pyghidra",
]
dev = [
    "pytest>=7.0.0",
    "pypdf>=4.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/luketegel/Freida"
Repository = "https://github.com/luketegel/Freida"

[project.scripts]
freida = "freida.cli:main"
ghidra-syscall-analyzer = "freida.cli:main"  # Original command name, kept as an alias.
freida-report = "freida.report_agent:main"
freida-web = "freida.webui.server:main"

# Package only the analyzer, not other folders in the checkout (e.g. freida_web_jobs/, tests/).
[tool.setuptools.packages.find]
include = ["freida", "freida.*"]

[tool.setuptools.package-data]
freida = ["webui/static/*", "samples/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Long report-template strings read better unwrapped.

[tool.ruff.lint.per-file-ignores]
# The trailing double spaces in the report header are Markdown hard line breaks.
"freida/report_generator.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["freida"]
