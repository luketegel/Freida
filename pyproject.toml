[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-syscall-analyzer"
version = "1.0.0"
description = "Decompile native executables with headless Ghidra and extract system calls into Markdown and PDF reports and model context"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ghidra Syscall Analyzer Team" }
]
dependencies = [
    "requests>=2.28.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ghidra = [
    "pyghidra",
]
mcp = [
    "mcp>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pypdf>=4.0",
]

[project.scripts]
ghidra-syscall-analyzer = "ghidra_syscall_analyzer.cli:main"
freida-report = "ghidra_syscall_analyzer.report_agent:main"
freida-web = "ghidra_syscall_analyzer.webui.server:main"

[tool.setuptools.package-data]
ghidra_syscall_analyzer = ["webui/static/*"]
