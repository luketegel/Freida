[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidra-syscall-analyzer"
version = "1.0.0"
description = "Decompile executables and applets with Ghidra MCP in Headless Mode and extract system calls into Markdown reports"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ghidra Syscall Analyzer Team" }
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ghidra-syscall-analyzer = "ghidra_syscall_analyzer.cli:main"
