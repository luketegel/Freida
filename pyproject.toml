[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freida"
version = "1.0.0"
description = "Decompile native executables with headless Ghidra and extract system calls into Markdown and PDF reports and model context"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ghidra Syscall Analyzer Team" }
]
dependencies = [
    "requests>=2.28.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ghidra = [
    "pyghidra",
]
mcp = [
    "mcp>=1.3.0",
]
dev = [
    "pytest>=7.0.0",
    "pypdf>=4.0",
]

[project.scripts]
freida = "freida.cli:main"
ghidra-syscall-analyzer = "freida.cli:main"  # Original command name, kept as an alias.
freida-report = "freida.report_agent:main"
freida-web = "freida.webui.server:main"

# Package only the analyzer, not other folders in the checkout (e.g. freida_web_jobs/, tests/).
[tool.setuptools.packages.find]
include = ["freida", "freida.*"]

[tool.setuptools.package-data]
freida = ["webui/static/*", "samples/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Long report-template strings read better unwrapped.

[tool.ruff.lint.per-file-ignores]
# The trailing double spaces in the report header are Markdown hard line breaks.
"freida/report_generator.py" = ["W291"]

[tool.ruff.lint.isort]
known-first-party = ["freida"]
